[package]
name = "wows-replay-sidecar"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bakes a WoWS replay into a compact draw-command timeline for the Tactics Planner replay viewer"

[[bin]]
name = "wows-replay-sidecar"
path = "src/main.rs"

[dependencies]
# The suite's own replay parser, pinned to a commit of LeCyanide/replay-parser
# (main, 2026-11-17). The repository is private: cargo fetches it with the
# git command line (see .cargo/config.toml), so the machine's own GitHub login
# is used. Bump `rev` to take a newer parser.
wows-replay-parser = { git = "https://github.com/LeCyanide/replay-parser", rev = "785511372d73647a74efe0a5336d8b40f7b90290" }
serde_json = "1"

[profile.release]
opt-level = 3
strip = true
