[package]
name = "wows-replay-sidecar"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bakes a WoWS replay into a compact draw-command timeline for the Tactics Planner replay viewer"

[[bin]]
name = "wows-replay-sidecar"
path = "src/main.rs"

[dependencies]
# landaire's wows-toolkit crates, from a checkout pinned to one upstream commit
# by scripts/build-sidecar.mjs (see TOOLKIT_REV there for why not crates.io);
# run that script, or its ensureToolkit step, before a bare `cargo build`. The
# encoder features (vulkan/cpu/cpu-av1) are deliberately off: we never
# rasterize or encode video, so none of wgpu/openh264/rav1e is linked.
wows_minimap_renderer = { path = "vendor/wows-toolkit/crates/minimap-renderer", default-features = false, features = ["rendering", "vfs", "arc"] }
wows_replays = { path = "vendor/wows-toolkit/crates/wows-replays", default-features = false, features = ["arc", "parsing", "vfs"] }
wowsunpack = { path = "vendor/wows-toolkit/crates/wowsunpack", default-features = false, features = ["arc", "vfs-mmap", "json", "parsing"] }
wows-battle-world = { path = "vendor/wows-toolkit/crates/wows-battle-world", default-features = false, features = ["vfs"] }
wows-replay-insights = { path = "vendor/wows-toolkit/crates/wows-replay-insights", default-features = false, features = ["build", "arc"] }
# Ship names live in the game's gettext catalog; without it the renderer emits
# no ship_name at all.
gettext = "0.4"
serde_json = "1"

[profile.release]
opt-level = 3
strip = true
