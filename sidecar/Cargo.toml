[package]
name = "wows-replay-sidecar"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bakes a WoWS replay into a compact draw-command timeline for the Tactics Planner replay viewer"

[[bin]]
name = "wows-replay-sidecar"
path = "src/main.rs"

[dependencies]
# The suite's own replay parser. shortcut: a path to a sibling checkout of
# LeCyanide/replay-parser (scripts/build-sidecar.mjs checks it is there);
# switch to a git dependency before CI builds it.
wows-replay-parser = { path = "../../replay-parser" }
serde_json = "1"

[profile.release]
opt-level = 3
strip = true
