[package]
name = "wows-replay-sidecar"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bakes a WoWS replay into a compact draw-command timeline for the Tactics Planner replay viewer"

[[bin]]
name = "wows-replay-sidecar"
path = "src/main.rs"

[dependencies]
# The suite's own replay parser, pinned to a commit of LeCyanide/replay-parser
# (main, 2026-11-18). Bump `rev` to take a newer parser.
wows-replay-parser = { git = "https://github.com/LeCyanide/replay-parser", rev = "4fc2a94d65ffd8911ebcd364d012d8c1b56ec19a" }
serde_json = "1"

[profile.release]
opt-level = 3
strip = true
